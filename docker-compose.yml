# Production stack for app.paymentrecon.site
#   db      — Postgres 16, NOT exposed to the host (only reachable inside the compose network)
#   backend — FastAPI (uvicorn) serving the API + the built SPA
#   caddy   — reverse proxy + automatic HTTPS (Let's Encrypt)
# Secrets (DB_PASSWORD, TW_JWT_SECRET) come from a local .env file, never committed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tw
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: twledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tw -d twledger"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TW_DSN: postgresql://tw:${DB_PASSWORD}@db:5432/twledger
      TW_JWT_SECRET: ${TW_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
