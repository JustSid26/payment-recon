<style>
        body {
            background-color: #f8fafc; /* Brand background anchor */
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-background {
            background: radial-gradient(circle at 0% 0%, rgba(33, 81, 218, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(33, 81, 218, 0.03) 0%, transparent 50%);
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #2151da;
            box-shadow: 0 0 0 1px rgba(33, 81, 218, 0.1);
        }
    </style>

<body class="flex items-center justify-center min-h-screen p-container-padding glass-background">
<!-- Login Container -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Center Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-stack-lg shadow-sm">
<!-- Identity Header -->
<header class="flex flex-col items-center text-center mb-stack-lg">
<div class="w-12 h-12 bg-primary-container text-on-primary flex items-center justify-center rounded-lg mb-stack-md">
<span class="material-symbols-outlined" style="font-size: 28px;">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">TransactWorld</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Merchant settlement &amp; ledger</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">Email address</label>
<input class="w-full h-12 px-stack-md rounded-[10px] border border-outline-variant bg-surface text-on-surface font-body-md input-focus-ring transition-all" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<input class="w-full h-12 px-stack-md rounded-[10px] border border-outline-variant bg-surface text-on-surface font-body-md input-focus-ring transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-[#1d4ed8] hover:bg-primary transition-colors text-white font-label-md text-label-md rounded-[10px] mt-2 flex items-center justify-center gap-stack-sm active:scale-[0.98]" type="submit">
                    Sign in
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Demo Account Section -->
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant">
<p class="font-label-sm text-label-sm text-outline mb-stack-md text-center uppercase tracking-widest">Demo Accounts</p>
<div class="flex flex-wrap justify-center gap-stack-sm">
<!-- Chip 1 -->
<button class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-secondary-container hover:bg-outline-variant transition-colors group">
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
<span class="font-label-sm text-label-sm text-on-secondary-container">Auditor</span>
<span class="material-symbols-outlined text-[14px] text-on-secondary-container opacity-0 group-hover:opacity-100 transition-opacity">login</span>
</button>
<!-- Chip 2 -->
<button class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-secondary-container hover:bg-outline-variant transition-colors group">
<div class="w-1.5 h-1.5 rounded-full bg-tertiary"></div>
<span class="font-label-sm text-label-sm text-on-secondary-container">Manager</span>
<span class="material-symbols-outlined text-[14px] text-on-secondary-container opacity-0 group-hover:opacity-100 transition-opacity">login</span>
</button>
</div>
</div>
</div>
<!-- Footer Links -->
<footer class="mt-stack-lg flex justify-center items-center gap-stack-md text-on-surface-variant">
<a class="font-label-sm text-label-sm hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="font-label-sm text-label-sm hover:text-primary transition-colors" href="#">Terms of Service</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="font-label-sm text-label-sm hover:text-primary transition-colors" href="#">Contact Support</a>
</footer>
</main>
<!-- Subtle Background Elements -->
<div class="fixed top-0 right-0 p-container-padding hidden md:block">
<div class="flex items-center gap-stack-sm font-label-sm text-label-sm text-on-surface-variant bg-surface-container rounded-full px-4 py-2 border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-primary" data-weight="fill">verified</span>
            System Operational
        </div>
</div>
<!-- Background Decoration -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-primary opacity-[0.03] rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed -top-24 -right-24 w-96 h-96 bg-primary opacity-[0.03] rounded-full blur-[100px] pointer-events-none"></div>
<script>
        // Simple Interaction logic for demo
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.type !== 'submit') e.preventDefault();
                console.log('Interaction logged for TransactWorld login');
            });
        });
    </script>
